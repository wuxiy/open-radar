[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-radar"
version = "0.1.0"
description = "A Git-backed personal open-source technology radar"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
open-radar = "open_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
