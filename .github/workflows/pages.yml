name: Deploy public catalog

on:
  push:
    branches:
      - main
    paths:
      - data/projects/**
      - data/observations/github/**
      - pyproject.toml
      - src/open_radar/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: PYTHONPATH=src python -m unittest discover -s tests -q
      - run: PYTHONPATH=src python -m open_radar.cli validate --root .
      - id: pages
        uses: actions/configure-pages@v5
      - run: |
          base_path="${PAGES_BASE_PATH%/}"
          PYTHONPATH=src python -m open_radar.cli render-site --root . --output-dir "$RUNNER_TEMP/open-radar-pages" --base-path "${base_path:-/}"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/open-radar-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
